[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-watch"
version = "0.2.7"
description = "Passive, read-only desktop observation for AI agents via MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jadiss" }]
keywords = ["mcp", "screenshot", "desktop", "agent", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
]
dependencies = [
  "mcp>=1.6.0",
  "mss>=9.0.1",
  "Pillow>=10.0.0",
  "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/JadissEL/screen-watch"
Repository = "https://github.com/JadissEL/screen-watch"
Issues = "https://github.com/JadissEL/screen-watch/issues"
Changelog = "https://github.com/JadissEL/screen-watch/blob/main/CHANGELOG.md"

[project.optional-dependencies]
windows = ["dxcam>=0.0.5"]
macos = ["pyobjc-framework-Quartz>=10.0"]
hotkey = ["pynput>=1.7.6"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
all = [
  "screen-watch[windows]",
  "screen-watch[macos]",
  "screen-watch[hotkey]",
]

[project.scripts]
screen-watch = "screen_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
screen_watch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI deterministic: classic pyflakes/pycodestyle + import sort.
select = ["E4", "E7", "E9", "F", "I"]

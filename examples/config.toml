# Copy to your user config dir and edit:
#   Windows: %APPDATA%\screen-watch\config.toml
#   macOS/Linux: ~/.config/screen-watch/config.toml
# Or set SCREEN_WATCH_CONFIG=/path/to/config.toml
#
# Precedence: explicit overrides > environment > this file > built-in defaults

max_width = 1280
max_height = 720
fps = 5.0
jpeg_quality = 60
backend = "auto"
# display = 1
blur = false
min_capture_interval_s = 0.12
history_size = 64
# recording_enabled = false
# focus_hotkey = "ctrl+shift+f"
# preferred_llm = "gpt-4o"
